name: Screenshots

# GitHub-hosted macOS is the deterministic authority for the committed
# screenshot matrix. The always-SwiftShader `screenshots` Playwright project
# regenerates the matrix on macos-15 in six shards; each shard verifies the
# captures it produced against the committed PNGs with a strict pixel tolerance
# (scripts/verify-matrix.js). The pinned pipeline has an irreducible sub-level
# flake — consecutive runs can differ by a handful of pixels, each by ±1 in one
# colour channel — so verification is pixel-tolerant, not byte-exact, while
# still failing on any real change.
#
# The `screenshots` job is only a capture matrix. The intended branch-protection
# required check is the aggregate `Screenshots — verify committed matrix` job:
# it runs after every shard even when one fails, merges all shard captures and
# verifies the FULL committed matrix in both directions — every committed PNG
# must have been captured within tolerance, and every captured matrix PNG must
# exist in the committed set. A shard that emits some but not all of its
# assigned captures is caught here, not by the per-shard step. Require just this
# one check.
#
# When the aggregate fails on a `master` push the baseline has genuinely moved
# (sub-tolerance drift passes, so it never reaches here): the `refresh` job
# rebuilds the committed matrix from the same run's shard captures, commits it
# and dispatches a fresh run to re-verify — so the developer's side is just
# `git pull`. Pull requests never auto-refresh (a red verify stays a review
# signal) and an incomplete capture set is never blessed. See the `refresh` job.
#
# Why macOS: Linux (ubuntu-latest) substitutes fonts (panel copy wraps) and
# rasterises differently, so it cannot reproduce the macOS-captured matrix.
# Only the capture shards need macOS; the aggregate verify job compares pixels
# and so runs on ubuntu-latest.
#
# Why no E2E_SCREENSHOTS_DIR / E2E_SCREENSHOTS_COMMIT: `CI` is set on Actions,
# so the deterministic path (single-thread SwiftShader pin via
# determinismSetup.js, one Playwright worker) applies with no extra flag.
# With neither override set, ui-states.spec.js captures into the gitignored
# `.opencode/tmp/screenshots/` (never the committed tree) and writes no
# diagnostics — exactly what this job wants.

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: screenshots-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  screenshots:
    name: screenshots (shard ${{ matrix.shard }}/6)
    runs-on: macos-15
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
      - run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install chromium
      - name: Capture matrix shard
        run: npx playwright test --project=screenshots --shard=${{ matrix.shard }}/6
        env:
          CI: "1"
      - name: Verify captures against the committed matrix
        run: |
          node scripts/verify-matrix.js \
            --committed screenshots \
            --captured .opencode/tmp/screenshots \
            --mode shard \
            --report screenshot-verify-shard-${{ matrix.shard }}.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots-shard-${{ matrix.shard }}
          path: |
            .opencode/tmp/screenshots/
            screenshot-verify-shard-${{ matrix.shard }}.txt
          if-no-files-found: ignore
          retention-days: 7

  # Aggregate verification — the intended required check. Each shard can only
  # see the files it produced, so a shard that emits some but not all of its
  # assigned captures passes its own step. This job merges every shard's
  # captures and verifies the FULL committed matrix in both directions. It runs
  # with `if: always()` so a mismatch is still reported when a shard fails.
  verify:
    name: Screenshots — verify committed matrix
    needs: screenshots
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Download all shard captures
        uses: actions/download-artifact@v4
        with:
          pattern: screenshots-shard-*
          path: captured
          merge-multiple: true
      - name: Verify the full committed matrix
        run: |
          node scripts/verify-matrix.js \
            --committed screenshots \
            --captured captured/.opencode/tmp/screenshots \
            --mode full \
            --report screenshot-verify-aggregate.txt
      - name: Upload verification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-verify-aggregate
          path: screenshot-verify-aggregate.txt
          if-no-files-found: ignore
          retention-days: 7

  # Auto-refresh on master. Triggered only when a `master` push genuinely moves
  # the matrix — i.e. the tolerant aggregate verification FAILED (sub-tolerance
  # drift passes and never reaches here). It rebuilds the committed baseline
  # from the SAME run's shard captures, commits it and dispatches a fresh run to
  # re-verify, so the developer's side is just `git pull`. It never runs on pull
  # requests or `workflow_dispatch`, so PRs stay strict. The capture set must be
  # complete and valid: `screenshots:fetch` refuses a partial or empty set, so
  # the job fails with no commit and the run stays red for a human — nothing is
  # ever blessed from an incomplete capture set. Re-runs are harmless: a second
  # pass finds nothing to commit and skips both the commit and the dispatch.
  refresh:
    name: Refresh committed matrix
    needs: [screenshots, verify]
    if: ${{ always() && github.event_name == 'push' && github.ref == 'refs/heads/master' && needs.verify.result == 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
      - name: Download the run's shard captures
        uses: actions/download-artifact@v4
        with:
          pattern: screenshots-shard-*
          path: captured
      - name: Assemble and write the committed matrix
        run: npm run screenshots:fetch -- --artifacts captured --write
      - name: Commit the refreshed matrix
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add screenshots
          if git diff --cached --quiet; then
            echo "No matrix changes to commit."
            echo "committed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "test(e2e): refresh screenshot matrix from run ${{ github.run_id }}" \
            -m "Refreshed automatically from https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}."
          git pull --rebase origin master
          git push origin HEAD:master
          echo "committed=true" >> "$GITHUB_OUTPUT"
      - name: Dispatch re-verification
        if: steps.commit.outputs.committed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run screenshots.yml --ref master
      - name: Summarise
        if: always()
        run: |
          {
            echo "### Screenshot matrix refresh"
            if [ "${{ steps.commit.outputs.committed }}" = "true" ]; then
              echo "Committed the refreshed matrix from run ${{ github.run_id }} and dispatched a re-verification run."
            else
              echo "No matrix change was committed (nothing to refresh, or the refresh did not complete); nothing dispatched."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
