name: CI

# One workflow for test, release and deploy.
#
# Everything lives in a single workflow because GITHUB_TOKEN-created pushes do
# not trigger further workflows. semantic-release pushes a version commit and a
# tag back to master; if that push fired a separate deploy workflow it would
# never run. Keeping release and deploy in the same run side-steps this. The
# release commit also carries "[skip ci]" so the push it creates does not
# re-trigger CI.
#
# Add `[skip e2e]` to the head commit message of a push to skip the functional
# e2e shards (docs/metadata-only changes); unit still runs and release proceeds.

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
      - run: npm ci
      - name: Format check
        run: npm run format:check
      - run: npm test
        env:
          CI: "1"

  e2e:
    name: e2e (shard ${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # `[skip e2e]` in the head commit message of a push skips the functional
    # suite; pull requests always run it.
    if: ${{ github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip e2e]') }}
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e -- --grep-invert @screenshots --shard=${{ matrix.shard }}/3
        env:
          CI: "1"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-artefacts-shard-${{ matrix.shard }}
          path: playwright-report/
          retention-days: 14
          if-no-files-found: ignore

  commits:
    name: Commit messages
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 so the BEFORE..AFTER range exists for the checker.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Check commit messages
        run: node .github/scripts/checkCommits.mjs
        env:
          # PRs compare against the base branch; pushes against the previous tip.
          BEFORE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          AFTER: ${{ github.sha }}

  release:
    needs: [unit, e2e, commits]
    # `always()` + `!cancelled()` keeps this evaluable when e2e was skipped
    # via `[skip e2e]` (without running on a cancelled workflow); the explicit
    # result checks preserve the gate — release runs only when unit, commits
    # and e2e (passed or deliberately skipped) are all satisfied.
    if: ${{ always() && !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/master' && needs.unit.result == 'success' && needs.commits.result == 'success' && (needs.e2e.result == 'success' || needs.e2e.result == 'skipped') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      released: ${{ steps.release.outputs.released }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
      - run: npm ci
      - name: Release
        id: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BEFORE=$(git rev-parse HEAD)
          npx semantic-release
          AFTER=$(git rev-parse HEAD)
          if [ "$BEFORE" != "$AFTER" ]; then
            echo "released=true" >> "$GITHUB_OUTPUT"
          else
            echo "released=false" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: release
    if: needs.release.outputs.released == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: "pages"
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
      - uses: actions/configure-pages@v5
      - run: npm ci
      - run: npm run build
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - uses: actions/deploy-pages@v4
        id: deployment
